<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red vs Blue - Multiplayer Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
        #connection-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .connected {
            background-color: rgba(0, 255, 0, 0.5);
        }
        .disconnected {
            background-color: rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div id="player-stats">Players: <span id="player-count">0</span></div>
        <div id="fps">FPS: <span id="fps-counter">0</span></div>
    </div>
    <div id="connection-status" class="disconnected">Disconnected</div>

    <!-- Import Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- Game client script -->
    <script type="module" src="/client/game.js"></script>
</body>
</html>
